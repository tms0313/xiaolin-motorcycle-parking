<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b35">
  <title>小霖的摩拖車停放紀錄</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">停</div>
    <div><h1>小霖的摩拖車停放紀錄</h1><p>共同停放紀錄</p></div>
    <button id="logoutBtn" class="quiet hidden" type="button">登出</button>
  </header>

  <main class="wrap">
    <section id="configNotice" class="notice hidden"></section>

    <section id="authPanel" class="panel auth-panel">
      <h2>登入紀錄系統</h2>
      <p class="muted">多人使用同一份停放紀錄，請使用個人帳號登入。</p>
      <form id="authForm">
        <label>Email<input id="email" type="email" autocomplete="email" required placeholder="輸入電子郵件"></label>
        <label>密碼<input id="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label>
        <div class="actions">
          <button class="primary" type="submit">登入</button>
          <button id="signupBtn" class="secondary" type="button">建立帳號</button>
        </div>
      </form>
      <p id="authMessage" class="message" role="status"></p>
    </section>

    <section id="appPanel" class="hidden">
      <section class="panel">
        <div class="section-heading">
          <div><h2>新增停放紀錄</h2><p class="muted">選擇固定地點，或新增其他 GPS 位置。</p></div>
          <span id="todayLabel" class="date-chip"></span>
        </div>
        <form id="recordForm">
          <label>停放日期<input id="recordDate" type="date" required></label>
          <div class="field-label">固定地點</div>
          <div class="location-grid" id="fixedLocations">
            <button type="button" class="location-choice" data-place="地點 A"><span>📍</span>地點 A</button>
            <button type="button" class="location-choice" data-place="地點 B"><span>📍</span>地點 B</button>
            <button type="button" class="location-choice" data-place="地點 C"><span>📍</span>地點 C</button>
            <button type="button" class="location-choice" data-place="地點 D"><span>📍</span>地點 D</button>
          </div>
          <div class="custom-location">
            <button id="gpsBtn" type="button" class="gps-button">◎ 其他位置：取得目前 GPS</button>
            <p id="gpsStatus" class="muted small">固定地點不會記錄 GPS；只有選擇其他位置時才需要定位。</p>
            <div id="gpsCoordinates" class="coords hidden"></div>
          </div>
          <label>備註（選填）<textarea id="note" rows="2" maxlength="500" placeholder="例如：停放位置、交接事項……"></textarea></label>
          <button id="saveBtn" class="primary full" type="submit" disabled>請先選擇停放地點</button>
          <p id="recordMessage" class="message" role="status"></p>
        </form>
      </section>

      <section class="panel history-panel">
        <div class="section-heading"><div><h2>停放歷史紀錄</h2><p class="muted">所有登入者共用，可共同查詢及維護。</p></div></div>
        <div class="filters">
          <label>查詢日期<input id="filterDate" type="date"></label>
          <label>地點<select id="filterPlace"><option value="">全部地點</option><option>地點 A</option><option>地點 B</option><option>地點 C</option><option>地點 D</option><option value="custom">其他 GPS 位置</option></select></label>
        </div>
        <div id="recordList" class="record-list"><div class="empty">登入後載入紀錄。</div></div>
      </section>
    </section>
  </main>
  <footer>小霖的摩拖車停放紀錄</footer>
</body>
</html>
